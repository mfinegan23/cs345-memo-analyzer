<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Call Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2230; --muted: #5b6577; --line: #d9dee6; --paper: #f2f4f7; --panel: #ffffff;
    --flag: #b8322a; --flag-bg: #fbeceb; --ok: #1d6f63; --ok-bg: #e6f3f0;
    --warn: #8a5a0b; --warn-bg: #fbf1dc; --accent: #2b4c7e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e6e9f0; --muted: #9aa5b8; --line: #2d3647; --paper: #141922; --panel: #1b2230;
      --flag: #ff8a80; --flag-bg: #3a1f1e; --ok: #6fd0bf; --ok-bg: #143029; --warn: #f0c36b; --warn-bg: #3a2e12; --accent: #8fb2ee; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.5 "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 22px clamp(16px, 4vw, 48px) 8px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
  h1 { font: 600 1.6rem/1.2 "Newsreader", Georgia, serif; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: .9rem; }
  main { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 20px;
    padding: 12px clamp(16px, 4vw, 48px) 48px; max-width: 1200px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
  h2 { font-size: 1rem; margin: 0 0 12px; font-weight: 600; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 14px 0 4px; }
  button, select, input[type=file]::file-selector-button {
    font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 12px; cursor: pointer; }
  select { width: 100%; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; padding: 11px; font-weight: 600; margin-top: 18px; }
  button.rec.live { background: var(--flag); border-color: var(--flag); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .timer { font-variant-numeric: tabular-nums; color: var(--muted); }
  audio { width: 100%; margin-top: 10px; }
  #status { margin-top: 12px; font-size: .9rem; color: var(--muted); min-height: 1.4em; }
  #status.error { color: var(--flag); }
  .empty { color: var(--muted); margin: 0; }
  .verdict { border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; border: 1px solid; }
  .verdict.flagged { background: var(--flag-bg); border-color: var(--flag); color: var(--flag); }
  .verdict.clear { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
  .verdict strong { font-size: 1.15rem; display: block; }
  .verdict ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink); }
  dl.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 0 0 18px; }
  dl.facts div { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  dt { font-size: .78rem; color: var(--muted); } dd { margin: 0; font-weight: 600; }
  dd.low { color: var(--warn); }
  /* Sentiment timeline: one row per sentence; the bar is its negative score */
  ol.timeline { list-style: none; margin: 0 0 18px; padding: 0; border-left: 2px solid var(--line); }
  ol.timeline li { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 8px 0 8px 12px; align-items: start; }
  .meter { height: 8px; border-radius: 4px; background: var(--line); margin-top: 9px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--flag); }
  .meter small { display: none; }
  li .sent { font: 400 1.05rem/1.45 "Newsreader", Georgia, serif; }
  li .tag { font-size: .75rem; color: var(--muted); display: block; }
  li.negative .tag { color: var(--flag); } li.positive .tag { color: var(--ok); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 18px; padding: 0; list-style: none; }
  .chips li { background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: .85rem; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; margin-bottom: 18px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  h3 { font-size: .9rem; margin: 18px 0 8px; font-weight: 600; }
  .summary { margin: 0 0 8px; }
  details pre { overflow: auto; background: var(--paper); padding: 10px; border-radius: 6px; font-size: .8rem; }
  @media (prefers-reduced-motion: no-preference) { .verdict { animation: settle .25s ease-out; } }
  @keyframes settle { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<header>
  <h1>Customer Call Reviewer</h1>
  <p>Transcribes a call, flags it for escalation, and redacts personal information.</p>
</header>
<main>
  <section class="panel" aria-labelledby="in-h">
    <h2 id="in-h">Add a call</h2>
    <div class="row">
      <button type="button" id="rec" class="rec">Record call</button>
      <span id="timer" class="timer" aria-live="off">0:00</span>
    </div>
    <label for="file">Or choose an audio file (WAV, MP3, M4A, WebM, OGG)</label>
    <input type="file" id="file" accept=".wav,.mp3,.m4a,.aac,.ogg,.webm,audio/*">
    <audio id="preview" controls hidden></audio>
    <label for="voice">Voice for the spoken summary</label>
    <select id="voice">
      <option value="jenny">Jenny (neutral, clear)</option>
      <option value="guy">Guy (formal)</option>
      <option value="aria">Aria (upbeat)</option>
    </select>
    <button type="button" id="go" class="primary" disabled>Review call</button>
    <div id="status" role="status" aria-live="polite"></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <button type="button" id="stats">Show session stats</button>
    <div id="statsOut"></div>
  </section>

  <section class="panel" aria-labelledby="out-h" aria-live="polite">
    <h2 id="out-h">Review</h2>
    <div id="results"><p class="empty">Record or choose a call, then select Review call. Results appear here.</p></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const REASONS = {
  overall_negative: "The overall tone of the call was negative.",
  multiple_negative_sentences: "Two or more sentences were strongly negative.",
  escalation_phrase: "The caller used an escalation phrase."
};
let blob = null, blobName = "", recorder = null, stream = null, chunks = [], tick = null, t0 = 0;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function setStatus(msg, isError) { const s = $("status"); s.textContent = msg; s.className = isError ? "error" : ""; }
function setBlob(b, name) {
  blob = b; blobName = name;
  const p = $("preview"); p.src = URL.createObjectURL(b); p.hidden = false;
  $("go").disabled = false; setStatus("");
}

/* ---- recording ---- */
$("rec").addEventListener("click", async () => {
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    setStatus("Microphone access was blocked. Allow it in the browser, or choose a file instead.", true); return;
  }
  const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm" : "audio/mp4";
  const ext = mime === "audio/webm" ? "webm" : "m4a";
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (ev) => { if (ev.data.size) chunks.push(ev.data); };
  recorder.onstop = () => {
    clearInterval(tick); stream.getTracks().forEach((t) => t.stop());
    $("rec").textContent = "Record call"; $("rec").classList.remove("live");
    setBlob(new Blob(chunks, { type: recorder.mimeType || mime }), "recording." + ext);
  };
  recorder.start();
  $("rec").textContent = "Stop recording"; $("rec").classList.add("live");
  t0 = Date.now();
  tick = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $("timer").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }, 250);
});
$("file").addEventListener("change", (ev) => { const f = ev.target.files[0]; if (f) setBlob(f, f.name); });

/* ---- submit ---- */
$("go").addEventListener("click", async () => {
  if (!blob) return;
  const fd = new FormData();
  fd.append("audio", blob, blobName);
  fd.append("voice", $("voice").value);
  $("go").disabled = true; setStatus("Reviewing call. This usually takes 10 to 30 seconds.");
  try {
    const res = await fetch("/process", { method: "POST", body: fd });
    const data = await res.json();
    if (!res.ok) {
      const msgs = {
        415: "That file could not be read as audio. Try WAV, MP3, M4A, WebM or OGG.",
        422: "No speech was found in this recording. Record again closer to the microphone.",
        413: "That file is over 25 MB. Choose a shorter recording."
      };
      setStatus(msgs[res.status] || ("The review failed at the " + (data.stage || "server") + " step. Try again."), true);
    } else { setStatus(""); render(data); }
  } catch (e) {
    setStatus("Could not reach the server. Check your connection and try again.", true);
  } finally { $("go").disabled = false; }
});

/* ---- results ---- */
function fact(dl, term, value, low) {
  const d = el("div"); d.append(el("dt", "", term)); d.append(el("dd", low ? "low" : "", value)); dl.append(d);
}
function render(d) {
  const root = $("results"); root.replaceChildren();

  const v = el("div", "verdict " + (d.escalation.flagged ? "flagged" : "clear"));
  v.append(el("strong", "", d.escalation.flagged ? "Flagged for escalation" : "Not flagged"));
  if (d.escalation.flagged) {
    const ul = el("ul"); d.escalation.reasons.forEach((r) => ul.append(el("li", "", REASONS[r] || r))); v.append(ul);
  }
  root.append(v);

  const facts = el("dl", "facts");
  fact(facts, "Overall tone", d.sentiment.label);
  fact(facts, "Length", d.duration_seconds.toFixed(0) + " seconds");
  fact(facts, "Transcription confidence", Math.round(d.confidence * 100) + "%", d.confidence < 0.8);
  fact(facts, "Personal details redacted", String(d.pii.redacted_count) + (d.pii.categories.length ? " (" + d.pii.categories.join(", ") + ")" : ""));
  root.append(facts);

  root.append(el("h3", "", "Transcript, sentence by sentence"));
  const tl = el("ol", "timeline");
  d.sentences.forEach((s) => {
    const li = el("li", s.label);
    const m = el("div", "meter"); const bar = el("span"); bar.style.width = Math.round(s.negative * 100) + "%";
    m.append(bar); m.title = "Negative score " + s.negative.toFixed(2);
    const body = el("div"); body.append(el("span", "sent", s.text.trim()));
    body.append(el("span", "tag", s.label + ", negative score " + s.negative.toFixed(2)));
    li.append(m, body); tl.append(li);
  });
  root.append(tl);

  root.append(el("h3", "", "Key phrases"));
  if (d.key_phrases.length) { const ul = el("ul", "chips"); d.key_phrases.forEach((k) => ul.append(el("li", "", k))); root.append(ul); }
  else root.append(el("p", "empty", "No key phrases found."));

  root.append(el("h3", "", "Entities"));
  if (d.entities.length) {
    const t = el("table"); const h = el("tr"); ["Text", "Type"].forEach((x) => h.append(el("th", "", x))); t.append(h);
    d.entities.forEach((e) => { const r = el("tr"); r.append(el("td", "", e.text), el("td", "", e.category)); t.append(r); });
    root.append(t);
  } else root.append(el("p", "empty", "No entities found."));

  root.append(el("h3", "", "Spoken summary"));
  root.append(el("p", "summary", d.summary_text));
  const a = el("audio"); a.controls = true;
  a.src = "data:audio/mp3;base64," + d.audio_base64;
  root.append(a);

  const det = el("details"); det.append(el("summary", "", "Stage timings"));
  det.append(el("pre", "", JSON.stringify(d.timings_ms, null, 2))); root.append(det);
}

/* ---- session stats ---- */
$("stats").addEventListener("click", async () => {
  const out = $("statsOut"); out.replaceChildren();
  try {
    const d = await (await fetch("/telemetry-summary")).json();
    if (d.message) { out.append(el("p", "empty", "No calls reviewed yet in this session.")); return; }
    const dl = el("dl", "facts"); dl.style.marginTop = "12px";
    fact(dl, "Calls", String(d.total_calls));
    fact(dl, "Flagged share", Math.round(d.flagged_share * 100) + "%");
    fact(dl, "Average confidence", Math.round(d.avg_confidence * 100) + "%");
    out.append(dl);
  } catch (e) { out.append(el("p", "empty", "Could not load session stats.")); }
});
</script>
</body>
</html>
